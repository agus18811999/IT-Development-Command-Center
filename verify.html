<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify Account · IT Development Hub</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:'Plus Jakarta Sans',sans-serif;min-height:100dvh;background:radial-gradient(circle at 90% 15%,#ffe5ce,transparent 40%),#fffaf6;display:grid;place-items:center;color:#172033;padding:18px}.panel{width:min(100%,460px);padding:42px 35px;background:white;border:1px solid #f5e2d5;border-radius:25px;box-shadow:0 22px 80px #b65b1630;text-align:center}.mark{width:65px;height:65px;background:linear-gradient(130deg,#fb9d52,#ef671c);color:white;display:grid;place-items:center;font-size:30px;margin:0 auto 22px;border-radius:20px}h1{letter-spacing:-.055em;font-size:29px;margin:0 0 13px}p{font-size:13px;color:#64748b;line-height:1.8}.btn{display:block;border:0;text-align:center;text-decoration:none;border-radius:12px;background:#f97316;color:#fff;font-size:13px;font-weight:800;padding:15px;cursor:pointer;width:100%;margin-top:21px}.field{width:100%;padding:14px;border:1px solid #ecdcd0;border-radius:11px;font:inherit;font-size:13px;outline:none;margin:10px 0}small{font-size:11px;color:#a2a8b3}.hidden{display:none}.notice{color:#aa3c22;font-size:12px}</style></head><body><main class="panel"><div class="mark">✦</div><h1 id="heading">Verifikasi akun developer</h1><p id="message">Memvalidasi kode verifikasi Firebase…</p><form id="resetForm" class="hidden"><input class="field" id="newPassword" type="password" minlength="8" placeholder="Password baru (minimal 8 karakter)" required><input class="field" id="confirm" type="password" minlength="8" placeholder="Ulangi password baru" required><button class="btn">Update password</button></form><a class="btn" href="index.html" id="back">Return to Sign In</a><p class="notice" id="notice"></p><small>IT Development Command Center · Secure Access</small></main><script src="config.js"></script><script>
(async()=>{'use strict';const $=id=>document.getElementById(id),p=new URLSearchParams(location.search),mode=p.get('mode'),code=p.get('oobCode');
if(!mode||!code){$('heading').textContent='Check your inbox';$('message').textContent='Klik tautan dari email Firebase untuk verifikasi atau reset password. Tautan yang sudah dibuka dapat digunakan sekali saja.';return;}
try{
 if(mode==='verifyEmail'){
  await ITAuth.confirmEmail(code);$('heading').textContent='Email berhasil diverifikasi';$('message').textContent='Akun kamu aktif. Silakan masuk untuk mengelola semua proyek IT kamu.';
 }else if(mode==='resetPassword'){
  await ITAuth.inspectReset(code);$('heading').textContent='Choose a new password';$('message').textContent='Tautan valid. Buat password baru untuk akun kamu.';$('resetForm').classList.remove('hidden');$('back').classList.add('hidden');
  $('resetForm').addEventListener('submit',async e=>{e.preventDefault();const pass=$('newPassword').value;
   if(pass!==$('confirm').value){$('notice').textContent='Password tidak sama.';return;}
   const btn=e.currentTarget.querySelector('button');btn.disabled=true;try{await ITAuth.confirmReset(code,pass);$('heading').textContent='Password updated';$('message').textContent='Password baru berhasil disimpan. Silakan login.';$('resetForm').classList.add('hidden');$('back').classList.remove('hidden');}catch(err){$('notice').textContent=err.message;}finally{btn.disabled=false;}});
 }else{$('heading').textContent='Unknown action';$('message').textContent='Jenis tautan tidak dikenali.';}
}catch(e){$('heading').textContent='Link unavailable';$('message').textContent=e.message+' Silakan meminta tautan baru dari halaman login.';}
})();
</script></body></html>
