/* ── OVERVIEW EXECUTIVE LUXURY SYSTEM ── */
.ov-hero-mesh {
  background: 
    radial-gradient(circle at 90% 10%, rgba(249, 115, 22, 0.32) 0%, transparent 45%),
    radial-gradient(circle at 15% 85%, rgba(244, 63, 94, 0.22) 0%, transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(251, 146, 60, 0.12) 0%, transparent 60%),
    linear-gradient(135deg, #0d0f17 0%, #171622 45%, #24141d 80%, #150e18 100%);
}

.ov-glass-card {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.35);
}

.ov-glass-card:hover {
  border-color: rgba(249, 115, 22, 0.45);
  box-shadow: 0 20px 40px -10px rgba(249, 115, 22, 0.22);
}

.ov-light-card {
  background: #ffffff;
  border: 1px solid #f1ece7;
  border-radius: 20px;
  box-shadow: 0 8px 30px rgba(135, 75, 30, 0.04);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.ov-light-card:hover {
  transform: translateY(-3px);
  border-color: #ffd6be;
  box-shadow: 0 16px 36px rgba(234, 88, 12, 0.1);
}

.ov-pulse-dot {
  position: relative;
  display: flex;
  width: 8px;
  height: 8px;
}
.ov-pulse-dot span:first-child {
  position: absolute;
  inset: 0;
  border-radius: 9999px;
  background-color: #22c55e;
  animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
  opacity: 0.75;
}
.ov-pulse-dot span:last-child {
  position: relative;
  border-radius: 9999px;
  width: 8px;
  height: 8px;
  background-color: #16a34a;
}

.it-logout-icon{width:70px;height:70px;display:grid;place-items:center;margin:7px auto 20px;border-radius:22px;background:linear-gradient(140deg,#ffede3,#fff7f3);color:#ed6c30;border:1px solid #ffe0d1;box-shadow:0 12px 29px #fc80402a}
.it-logout-icon svg{width:30px;height:30px;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none}
.it-logout-spin{animation:it-logout-turn .8s linear infinite;transform-origin:center}
.it-logout-card .it-logout-label{font-size:10px;font-weight:800;color:#ef6c2e;letter-spacing:.13em;text-transform:uppercase}
.it-logout-card h2{margin:10px 0 8px;color:#252c41;font-size:clamp(20px,5vw,25px);line-height:1.25;letter-spacing:-.055em;font-weight:800}
.it-logout-card p{margin:0 auto;color:#8b97a8;line-height:1.75;font-size:12px;max-width:320px}
.it-logout-progress{margin:24px auto 1px;height:5px;border-radius:50px;background:#fff0e9;overflow:hidden}
.it-logout-progress span{display:block;height:100%;width:45%;border-radius:inherit;background:linear-gradient(90deg,#fc7930,#ff6471);animation:it-logout-progress 1s ease-in-out infinite}
@keyframes it-logout-turn{to{transform:rotate(360deg)}}
@keyframes it-logout-fade{from{opacity:0}to{opacity:1}}
@keyframes it-logout-progress{from{transform:translateX(-110%)}to{transform:translateX(240%)}}

/* ── DEVELOPMENT CALENDAR LUXURY SYSTEM ── */
/* ── REVISI: FULL-BODY LUXURY GRADIENT UNTUK KARTU KALENDER & TANGGAL ── */

/* 1. Container Kalender Utama (Gradasi Merata Seluruh Papan) */
.cal-board-card {
  background: linear-gradient(170deg, #ffffff 0%, #fff8f4 35%, #ffefe5 75%, #ffe9db 100%) !important;
  border: 1px solid #fbdac7 !important;
  border-radius: 26px;
  box-shadow: 0 12px 35px -10px rgba(234, 88, 12, 0.1), 0 4px 12px rgba(0, 0, 0, 0.02);
}

/* 2. Seluruh Kotak Tanggal (Gradasi Penuh dari Atas sampai Bawah) */
.cal-day-cell {
  background: linear-gradient(165deg, #ffffff 0%, #fff6ee 45%, #ffebdc 100%) !important;
  background-size: 100% 100% !important;
  border: 1px solid #fcd5be !important;
  border-radius: 14px;
  box-shadow: 0 2px 6px rgba(234, 88, 12, 0.04);
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  position: relative;
  overflow: hidden;
}

/* Hover Efek pada Tanggal */
.cal-day-cell:hover {
  background: linear-gradient(165deg, #ffffff 0%, #fff2e6 40%, #ffe2cc 100%) !important;
  border-color: #fb923c !important;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px -4px rgba(234, 88, 12, 0.2) !important;
}

/* 3. Tanggal HARI INI (Today) - Gradasi Penuh Berbingkai Oranye */
.cal-day-cell.pl-today {
  background: linear-gradient(165deg, #ffffff 0%, #ffedd5 45%, #fed7aa 100%) !important;
  border: 2px solid #f97316 !important;
  box-shadow: 0 0 0 2.5px rgba(249, 115, 22, 0.25), 0 6px 16px -3px rgba(249, 115, 22, 0.2) !important;
}

/* 4. Tanggal TERPILIH (Selected / Saat Diklik) - Gradasi Penuh Amber Sunset */
.cal-day-cell.pl-selected {
  background: linear-gradient(165deg, #fff7ed 0%, #fed7aa 50%, #fdba74 100%) !important;
  border: 2px solid #ea580c !important;
  box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.3), 0 10px 22px -4px rgba(234, 88, 12, 0.25) !important;
}

.cal-view-pill {
  background: rgba(255, 255, 255, 0.8);
  border: 1px solid rgba(251, 146, 60, 0.25);
  border-radius: 14px;
  padding: 4px;
}

.cal-view-btn {
  padding: 7px 16px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 800;
  color: #64748b;
  transition: all 0.2s ease;
}

.cal-view-btn.active {
  background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(234, 88, 12, 0.35);
}

@keyframes itMetricPop{0%{filter:brightness(1.5);transform:translateY(-2px)}100%{filter:none;transform:none}}
.it-metric-changed{animation:itMetricPop .36s ease-out}
@media(prefers-reduced-motion:reduce){.it-metric-changed{animation:none}}

 const content=document.createElement('div'),title=document.createElement('strong'),desc=document.createElement('p');title.textContent=type==='error'?'Ada masalah':'Berhasil';desc.textContent=String(message||'');content.append(title,desc);
 const close=document.createElement('button');close.type='button';close.setAttribute('aria-label','Close notification');close.textContent='×';
 el.append(badge,content,close);wrap.append(el);
 const dismiss=()=>{el.classList.add('toast-leave');setTimeout(()=>el.remove(),200);};const timer=setTimeout(dismiss,5200);
 close.onclick=()=>{clearTimeout(timer);dismiss();};
}

/**
 * Logout cepat tanpa menunggu latency Apps Script.
 * 1) Ambil kredensial yang masih aktif; 2) mulai revoke di backend (keepalive);
 * 3) hapus sesi lokal SEKETIKA; 4) alihkan ke login paling lambat ~1 detik.
 * Jika jaringan gagal, sesi browser tetap terhapus. Pencabutan sesi server
 * bersifat best-effort hingga backend memberi respons.

let IT_logoutBusy=false;
async function IT_fastLogout(){
 if(IT_logoutBusy)return;
 const confirmed=await askConfirm('Keluar dari workspace?','Sesi akun pada browser ini akan diakhiri. Data proyek yang tersimpan tetap aman.','Ya, keluar',true);
 if(!confirmed||IT_logoutBusy)return;
 IT_logoutBusy=true;
 const started=performance.now();
 const layer=document.createElement('div');
 layer.className='it-logout-layer';layer.setAttribute('role','alertdialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-labelledby','itLogoutHeading');
 layer.innerHTML=`<div class="it-logout-card"><div class="it-logout-icon" id="itLogoutIcon"><svg class="it-logout-spin" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 18 6.5L20 12M4 12l2 5.5A7 7 0 0 0 18.4 15"/></svg></div><span class="it-logout-label">ITCOMMAND / ACCOUNT SECURITY</span><h2 id="itLogoutHeading">Sedang mengakhiri sesi…</h2><p id="itLogoutDetail">Menutup akses workspace pada perangkat ini dengan aman.</p><div class="it-logout-progress" aria-hidden="true"><span></span></div></div>`;
 document.body.append(layer);
 document.body.setAttribute('aria-busy','true');
 try{
   // Snapshot token HARUS dibuat sebelum ITAuth.clear(), agar bisa revoke server.
   const snapshot=typeof ITAuth.current==='function'?ITAuth.current():null;
   const token=snapshot?.idToken||'';
   const session=snapshot?.serverSession||'';
   const apiURL=window.APP_CONFIG?.API_URL||'/api/proxy';
   let revoke=Promise.resolve(false);
   if(token&&session){
     // keepalive memungkinkan browser melanjutkan POST walau halaman sedang ditutup.
     revoke=fetch(apiURL,{method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({action:'revokeSession',payload:{},token,session}),keepalive:true})
       .then(async res=>{const body=await res.json();if(!res.ok||!body?.success)throw Error(body?.error?.message||'Server belum mengonfirmasi revoke');return true;})
       .catch(err=>{console.warn('[ITCOMMAND LOGOUT] Revocation belum terkonfirmasi:',err.message);return false;});
   }
   // Pembersihan lokal tidak lagi menunggu Google Apps Script (hingga 25 detik).
   try{ITAuth.clear();}catch(err){console.warn('[ITCOMMAND LOGOUT] local clear:',err);}
   try{localStorage.removeItem('it_session');sessionStorage.removeItem('it_session');}catch(_){}
   S.requestId++;S.formReqId++;S.cache.clear();S.viewCache.clear();S.projects=[];S.user=null;
   layer.querySelector('#itLogoutHeading').textContent='Sesi browser diakhiri';
   layer.querySelector('#itLogoutDetail').textContent='Mengalihkan ke halaman login. Data kamu tetap tersimpan.';
   layer.querySelector('#itLogoutIcon').innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
   const result=await Promise.race([revoke,new Promise(resolve=>setTimeout(()=>resolve('pending'),850))]);
   // Waktu minimum agar status sukses benar-benar terlihat, tanpa spinner menggantung.
   const elapsed=performance.now()-started;
   if(elapsed<430)await new Promise(resolve=>setTimeout(resolve,430-elapsed));
   console.info(`[ITCOMMAND LOGOUT] Local session cleared; server revoke ${result===true?'confirmed':result==='pending'?'in progress':'unconfirmed'}; ${Math.round(performance.now()-started)}ms`);
 }catch(err){
   console.warn('[ITCOMMAND LOGOUT] Fallback sign-out:',err);
   try{ITAuth.clear();}catch(_){}
   try{localStorage.removeItem('it_session');sessionStorage.removeItem('it_session');}catch(_){}
 }finally{
   window.location.replace('index.html');
 }
}

 const newRecords=nextRoot.querySelector('[data-it-records]');

 const newHero=nextRoot.querySelector(':scope > section.ov-hero-mesh');
 if(!oldRecords||!newRecords||!oldHero||!newHero)return false;
 // Only the telemetry card is replaced; hero headline and button nodes stay mounted.
 const oldMetrics=oldHero.querySelector('.ov-glass-card');
 const newMetrics=newHero.querySelector('.ov-glass-card');
 if(oldMetrics&&newMetrics){oldMetrics.replaceWith(newMetrics);}
 else oldHero.replaceWith(newHero);
 oldRecords.replaceWith(newRecords);
 // Some generic routes have independently computed summary widgets (e.g. Costs).
 // Replace those, while keeping the search/filter controls and hero undisturbed.
 const oldChildren=Array.from(oldRoot.children),newChildren=Array.from(nextRoot.children);
 if(oldChildren.length===newChildren.length){
  oldChildren.forEach((node,i)=>{
   if(node===oldHero||node===oldRecords||node.matches('.proj-control-deck'))return;
   if(node.isConnected&&newChildren[i])node.replaceWith(newChildren[i]);
  });
 }
 console.info('[ITCOMMAND LIVE] Metrics refreshed',{route,records:S.currentList?.total??S.rows?.length??0});
 return true;
}

function pager(d) {
  const totalPages = Math.max(1, Math.ceil(d.total / d.pageSize));
  const isSinglePage = totalPages <= 1;

  return `
  <div class="mt-4 p-3 sm:p-3.5 rounded-2xl bg-gradient-to-r from-white/95 via-[#fffaf5] to-white/95 border border-[#fbdac7] shadow-2xs flex flex-col sm:flex-row items-center justify-between gap-3">

        <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
        <span>${d.total} Record${d.total > 1 ? 's' : ''} Terdata</span>
      </div>
      <span class="text-[11px] font-bold text-slate-500">
        Halaman <b class="text-slate-800">${d.page}</b> dari <b class="text-slate-800">${totalPages}</b>
      </span>
    </div>

    <!-- Sisi Kanan: Status Data / Tombol Navigasi Halaman -->
    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
      ${isSinglePage ? `
        <span class="inline-flex items-center gap-1.5 text-[11px] font-extrabold text-emerald-800 bg-emerald-50 px-3 py-1.5 rounded-xl border border-emerald-200 shadow-2xs">
          <span>✓</span> Seluruh data ditampilkan
        </span>
      ` : `
        <button type="button" 
          class="btn small font-bold" 
          data-action="pagePrev" 
          ${d.page <= 1 ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>
          ← Sebelumnya
        </button>
        <button type="button" 
          class="btn small font-bold" 
          data-action="pageNext" 
          ${d.page >= totalPages ? 'disabled style="opacity:0.4;cursor:not-allowed;"' : ''}>
          Berikutnya →
        </button>
      `}
    </div>

  </div>
  `;
}

// 1. UNIVERSAL EXECUTIVE ENGINE UNTUK SELURUH 13 FITUR GENERIC ROUTE
// ══════════════════════════════════════════════════════════════════════════
async function generic(route) {
  const def = definitions[route];
  if (!def) return `<div class="empty"><b>Modul tidak ditemukan</b></div>`;

  const args = {
    page: S.page,
    pageSize: APP_CONFIG.DEFAULT_PAGE_SIZE,
    query: S.query,
    projectId: S.filterProject
  };

  const d = await moduleData(def.table, args);
  S.currentList = d;
  S.currentTable = def.table;
  S.rows = d.items;

  // Real-time Telemetry Stats
  const totalItems = d.total || 0;
  const activeProjectsCount = new Set(d.items.map(r => r.projectId).filter(Boolean)).size;

  // Smart Category / Secondary Metric Detector
  let secondaryLabel = 'Kategori';
  let secondaryValue = '—';
  if (route === 'bugs') {
    secondaryLabel = 'Open Bugs';
    secondaryValue = d.items.filter(r => !/resolved|closed/i.test(r.status || '')).length + ' Issue';
  } else if (route === 'features') {
    secondaryLabel = 'In Progress';
    secondaryValue = d.items.filter(r => /developing|planned/i.test(r.status || '')).length + ' Fitur';
  } else if (route === 'releases') {
    secondaryLabel = 'Planned';
    secondaryValue = d.items.filter(r => /planned/i.test(r.status || '')).length + ' Rilis';
  } else if (route === 'deployments') {
    secondaryLabel = 'Live Deploy';
    secondaryValue = d.items.filter(r => /live/i.test(r.status || '')).length + ' Live';
  } else if (route === 'costs') {
    secondaryLabel = 'Active Services';
    secondaryValue = d.items.filter(r => r.status !== 'Cancelled').length + ' Layanan';
  } else {
    const cats = new Set(d.items.map(r => r.category || r.type || r.platform || r.language).filter(Boolean));
    secondaryValue = cats.size + ' Jenis';
  }

  // Modul Extras (Costs, Domains, APIs)
  let extras = '';
  if (route === 'costs') {
    extras = await costSummary();
  } else if (route === 'domains') {
    extras = `
      <div class="p-3.5 sm:p-4 rounded-2xl bg-amber-500/10 border border-amber-300/60 text-xs text-amber-950 font-medium flex items-center gap-3 shadow-2xs">

        <span>Keamanan Terjamin: Simpan nama referensi secret saja. Jangan pernah memasukkan API key, token JWT, atau password privat ke dalam form.</span>
      </div>`;
  }

  return `

// 2. LUXURY TABLE RENDERER (MENGGANTIKAN TABEL PUTIH POLOS JADI MEWAH)
// ══════════════════════════════════════════════════════════════════════════
function renderTable(rows, columns, table) {
  const isProjectTable = table === 'Projects';
  const allCols = (isProjectTable ? [] : ['projectId']).concat(columns);

  if (S.sort) {
    rows = rows.slice().sort((a, b) => str(a[S.sort]).localeCompare(str(b[S.sort]), 'id', { numeric: true }) * S.sortDir);
  }

  // Kolom yang wajib Rata Tengah (Center Alignment)
  const isCenterCol = (col) => {
    return [
      'status', 'environment', 'priority', 'severity', 'version', 
      'targetVersion', 'isDone', 'visibility', 'date', 'expiresAt', 
      'renewalDate', 'dueDate', 'amount'
    ].includes(col);
  };

  // Helper Render Isi Cell
  const renderCellContent = (k, val, row, isFirst) => {
    // 1. Kolom Proyek Terkait (Kiri)
    if (k === 'projectId') {
      const pName = projectName(val);
      return `
        <div class="flex items-center gap-2.5 min-w-0">
          <span class="w-6 h-6 rounded-md bg-orange-100/90 text-orange-700 border border-orange-200 text-[10px] font-black flex items-center justify-center shrink-0">
            ${esc(pName.charAt(0) || 'P')}
          </span>
          <span class="text-xs font-black text-slate-800 truncate max-w-[210px] block" title="${esc(pName)}">
            ${esc(pName)}
          </span>
        </div>`;
    }

    // 2. Status / Priority / Environment Badges (Rata Tengah)
    if (['status', 'priority', 'severity', 'environment', 'isDone', 'visibility'].includes(k)) {
      const s = String(val || '').toLowerCase();
      let colorClass = 'bg-slate-100 text-slate-700 border-slate-200';
      if (/critical|failed|expired|reopened/i.test(s)) colorClass = 'bg-rose-50 text-rose-800 border-rose-300 shadow-2xs';
      else if (/active|completed|released|live|done|paid|resolved|closed|true|public/i.test(s)) colorClass = 'bg-emerald-50 text-emerald-800 border-emerald-300 shadow-2xs';
      else if (/medium|pending|testing|planning|developing|idea|staging/i.test(s)) colorClass = 'bg-amber-50 text-amber-900 border-amber-300 shadow-2xs';
      else if (/high|major/i.test(s)) colorClass = 'bg-orange-50 text-orange-800 border-orange-300 shadow-2xs';
      else if (/internal|private/i.test(s)) colorClass = 'bg-purple-50 text-purple-800 border-purple-200 shadow-2xs';
      
      return `
        <div class="flex justify-center">
          <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-[10px] font-black border ${colorClass}">
            ${/live/i.test(s) ? '<span class="ov-pulse-dot scale-75 inline-block"><span></span><span></span></span>' : ''}
            ${esc(val || '—')}
          </span>
        </div>`;
    }

    // 3. Versi / Code Monospace (Rata Tengah)
    if (['version', 'targetVersion', 'branch', 'commit'].includes(k)) {
      return val ? `
        <div class="flex justify-center">
          <span class="font-mono text-[11px] font-bold px-2.5 py-0.5 rounded-md bg-white border border-orange-200/80 text-slate-700 shadow-2xs">
            ${esc(val)}
          </span>
        </div>` : '<div class="text-center text-xs text-slate-400">—</div>';
    }

    // 4. Tanggal (Rata Tengah)
    if (/Date$|At$|^date$|^dueDate$|^expiresAt$/.test(k)) {
      if (!val) return '<div class="text-center text-xs text-slate-400">—</div>';
      return `<div class="text-center text-xs font-semibold text-slate-700">${fmtDate(val)}</div>`;
    }

    // 5. Nominal Biaya (Rata Tengah)
    if (k === 'amount') {
      return `<div class="text-center text-xs font-black text-emerald-700">${esc(money(val, row.currency || 'IDR'))}</div>`;
    }

    // 6. URLs & Link Action (Rata Tengah)
    if (['url', 'docsUrl', 'baseUrl', 'productionUrl', 'consoleUrl', 'backendUrl'].includes(k)) {
      const u = urlSafe(val);
      if (u) {
        return `
          <div class="flex justify-center">
            <a href="${esc(u)}" target="_blank" rel="noopener noreferrer" 
              class="inline-flex items-center gap-1 text-[11px] font-bold text-orange-600 hover:text-orange-700 hover:underline">
              <span>Buka Link ↗</span>
            </a>
          </div>`;
      }
      return `<div class="text-center text-xs text-slate-400">—</div>`;
    }

    // 7. Kolom Utama (Platform / Nama / Title) dengan Avatar Monogram (Kiri)
    if (isFirst) {
      const initial = esc(str(val).charAt(0).toUpperCase() || '◈');
      return `
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 text-white font-black text-xs flex items-center justify-center shadow-xs shrink-0">
            ${initial}
          </div>
          <div class="min-w-0">
            <b class="text-xs font-black text-slate-900 block truncate max-w-[220px]" title="${esc(val)}">${esc(val || '—')}</b>
            ${row.notes || row.description ? `<p class="text-[10px] text-slate-500 truncate max-w-[220px] font-normal mt-0.5">${esc(row.notes || row.description)}</p>` : ''}
          </div>
        </div>`;
    }

    // Kolom Teks Standar
    return `<span class="text-xs font-medium text-slate-700 block truncate max-w-[220px]">${esc(short(val, 45))}</span>`;
  };

  return `
  <div class="tech-table-deck w-full">
    <div class="overflow-x-auto scrollbar-thin w-full">
      <table class="w-full border-collapse text-left min-w-[860px] table-auto">
        
        <!-- HEADER TABEL -->
        <thead>
          <tr class="tech-th-head">
            ${allCols.map((col, idx) => {
              const center = isCenterCol(col);
              const isFirstCol = idx === 0;
              return `
                <th class="py-4 ${isFirstCol ? 'pl-6 pr-4' : 'px-4'} ${center ? 'text-center' : 'text-left'} cursor-pointer hover:text-orange-700 transition-colors whitespace-nowrap" 
                    data-action="sort" 
                    data-key="${esc(col)}">
                  <div class="inline-flex items-center gap-1.5 ${center ? 'justify-center' : 'justify-start'}">
                    <span>${esc(headerName(col))}</span>
                    <span class="text-[9px] opacity-70">↕</span>
                  </div>
                </th>
              `;
            }).join('')}
            
            <!-- HEADER KOLOM AKSI (RATA TENGAH PRESISI) -->
            <th class="py-4 pl-4 pr-6 text-center whitespace-nowrap min-w-[170px]">
              Aksi
            </th>
          </tr>
        </thead>

        <!-- BODY DATA TABEL -->
        <tbody>
          ${rows.map(row => `
            <tr class="tech-table-row">
              ${allCols.map((col, idx) => {
                const center = isCenterCol(col);
                const isFirstCol = idx === 0;
                return `
                  <td class="py-4 ${isFirstCol ? 'pl-6 pr-4' : 'px-4'} ${center ? 'text-center' : 'text-left'}">
                    ${renderCellContent(col, row[col], row, idx === (isProjectTable ? 0 : 1))}
                  </td>
                `;
              }).join('')}
              
              <!-- TOMBOL AKSI (RATA TENGAH PRESISI) -->
              <td class="py-4 pl-4 pr-6 text-center whitespace-nowrap">
                <div class="flex items-center justify-center gap-1.5">
                  <button type="button" class="btn small" data-action="edit" data-table="${esc(table)}" data-id="${esc(row.id)}">
                    Edit
                  </button>
                  ${table === 'Projects' ? `
                    <button type="button" class="btn small" data-action="openProject" data-id="${esc(row.id)}">Open</button>
                  ` : `
                    <button type="button" class="btn small" data-action="preview" data-table="${esc(table)}" data-id="${esc(row.id)}">View</button>
                  `}
                  <button type="button" class="btn small danger" data-action="delete" data-table="${esc(table)}" data-id="${esc(row.id)}">
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          `).join('')}
        </tbody>

      </table>
    </div>
  </div>
  `;
}

// 3. LUXURY BENTO CARDS UNTUK ESTIMASI BIAYA (COSTS & SERVICES)

async function costSummary() {
  const records = await list('ProjectCosts', { page: 1, pageSize: 100 });
  const groups = {};
  
  records.items.forEach(r => {
    if (r.status === 'Cancelled') return;
    const cur = r.currency || 'IDR';
    const rate = { Monthly: 1, Weekly: 52 / 12, Quarterly: 1 / 3, Yearly: 1 / 12, 'One-time': 0 }[r.cycle] ?? 0;
    groups[cur] = (groups[cur] || 0) + Number(r.amount || 0) * rate;
  });

  const entries = Object.entries(groups);

  return `
  <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
    ${entries.length ? entries.map(([cur, monthly]) => `
      <div class="ws-body-card p-5 sm:p-6 flex flex-col justify-between relative overflow-hidden group">
        <div>
          <div class="flex items-center justify-between mb-3">
            <span class="text-[10px] font-black uppercase tracking-wider text-orange-900/60">ESTIMASI BIAYA BULANAN</span>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-orange-100 text-orange-700">${esc(cur)}</span>
          </div>
          <h2 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-none my-1">
            ${esc(money(monthly, cur))}
          </h2>
          <span class="text-[11px] font-medium text-slate-500 mt-1 block">Recurring infrastructure burn rate</span>
        </div>
        <div class="pt-3 mt-4 border-t border-orange-200/50 flex items-center justify-between text-xs">
          <span class="font-bold text-slate-500">Estimasi Tahunan:</span>
          <b class="font-black text-emerald-700">${esc(money(monthly * 12, cur))}</b>
        </div>
      </div>
    `).join('') : `
      <div class="col-span-full ws-body-card p-6 text-center">
        <b class="text-sm font-extrabold text-slate-800">Belum Ada Biaya Berlangganan</b>
        <p class="text-xs text-slate-500 mt-1">Catat biaya server, domain, atau API bulanan untuk melihat estimasi pengeluaran tim kamu.</p>
      </div>
    `}
  </section>
  `;
}

// 2. LUXURY TIMELINE COMPONENT (DIPAKAI DI ACTIVITY & OVERVIEW)
// ══════════════════════════════════════════════════════════════════════════
function timeline(rows) {
  // Action Badge Helper
  const getActionBadge = (action) => {
    const a = String(action || 'UPDATE').toUpperCase();
    if (a === 'CREATE') {
      return { bg: 'bg-emerald-50 text-emerald-800 border-emerald-300/80', icon: '＋', dot: 'bg-emerald-500' };
    }
    if (a === 'UPDATE') {
      return { bg: 'bg-amber-50 text-amber-900 border-amber-300/80', icon: '✎', dot: 'bg-amber-500' };
    }
    if (a === 'DELETE') {
      return { bg: 'bg-rose-50 text-rose-800 border-rose-300/80', icon: '✕', dot: 'bg-rose-500' };
    }
    if (a === 'ARCHIVE') {
      return { bg: 'bg-purple-50 text-purple-800 border-purple-200', icon: '▤', dot: 'bg-purple-500' };
    }
    if (a === 'RESTORE') {
      return { bg: 'bg-blue-50 text-blue-800 border-blue-200', icon: '↻', dot: 'bg-blue-500' };
    }
    if (a === 'DUPLICATE') {
      return { bg: 'bg-orange-50 text-orange-800 border-orange-300', icon: '⧉', dot: 'bg-orange-500' };
    }
    if (a === 'IMPORT') {
      return { bg: 'bg-indigo-50 text-indigo-800 border-indigo-200', icon: '⇧', dot: 'bg-indigo-500' };
    }
    return { bg: 'bg-slate-100 text-slate-700 border-slate-200', icon: '●', dot: 'bg-slate-500' };
  };

  return `
  <div class="relative pl-6 sm:pl-8 space-y-4 before:absolute before:left-3 sm:before:left-4 before:top-3 before:bottom-3 before:w-0.5 before:bg-gradient-to-b before:from-orange-400 before:via-amber-300 before:to-orange-100">
    ${rows.map(r => {
      const act = getActionBadge(r.action);
      const cleanEntity = String(r.entity || 'Data').replace(/^Project/, '');
      return `
      <div class="relative group">
        
        <!-- Timeline Dot Indicator -->
        <div class="absolute -left-6 sm:-left-8 top-3.5 w-3 h-3 rounded-full bg-white border-2 border-orange-500 shadow-xs group-hover:scale-125 transition-transform"></div>

        <!-- Activity Row Item Card -->
        <div class="p-3.5 sm:p-4 rounded-2xl bg-white/80 hover:bg-white border border-orange-200/60 hover:border-orange-400 shadow-2xs hover:shadow-xs transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 sm:gap-4">
          
          <div class="flex items-start sm:items-center gap-3 min-w-0">
            <!-- Action Pill Badge -->

/* ═════════════ INTERACTIVE DEVELOPMENT PLANNING ═════════════
 * One authenticated planningBundle request; shared by the timeline and calendar.
 * All dates are treated as date-only values, so timezone does not shift deadlines.
 */
function localISO(date){return date.toISOString().slice(0,10)}
/* Date compatibility patch: Sheets getValues() may return a Date serialized as ISO datetime. */
function planningDateOnly(value){
 if(value===null||value===undefined||value==='')return '';
 if(value instanceof Date){return isNaN(value.getTime())?'':value.toISOString().slice(0,10);}
 const raw=String(value).trim();
 let ymd='';
 const iso=raw.match(/^(\d{4}-\d{2}-\d{2})(?:[Tt\s].*)?$/);
 if(iso)ymd=iso[1];
 else {
  // DD/MM/YYYY and DD-MM-YYYY are accepted for legacy Indonesian Sheets values.
  const regional=raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(regional)ymd=`${regional[3]}-${regional[2].padStart(2,'0')}-${regional[1].padStart(2,'0')}`;
  else if(/^\d{5}(?:\.\d+)?$/.test(raw)){
   // Spreadsheet serial date (date-only): 1899-12-30 is the serial origin.
   const serial=Number(raw);if(serial>=20000&&serial<100000){const d=new Date(Date.UTC(1899,11,30)+Math.floor(serial)*86400000);ymd=d.toISOString().slice(0,10);}
  }
 }
 if(!ymd)return '';
 const parsed=new Date(ymd+'T00:00:00Z');
 return Number.isFinite(parsed.getTime())&&parsed.toISOString().slice(0,10)===ymd?ymd:'';
}
function parseISO(value){const iso=planningDateOnly(value);return iso?new Date(iso+'T00:00:00Z'):null;}
function normalizePlanningBundleDates(bundle){
 if(!bundle||typeof bundle!=='object')return bundle;
 const mapping={
  phases:['startDate','endDate'],events:['startDate','endDate'],
  milestones:['dueDate'],releases:['date'],deployments:['date'],
  projects:['startDate','targetDate','releaseDate']
 };
 for(const [collection,fields] of Object.entries(mapping)){
  if(!Array.isArray(bundle[collection]))continue;
  for(const row of bundle[collection]){
   if(!row||typeof row!=='object')continue;
   for(const field of fields){
    if(!row[field])continue;
    const normalized=planningDateOnly(row[field]);
    if(normalized)row[field]=normalized;
   }
  }
 }
 return bundle;
}

function addPlanDays(d,days){return new Date(d.getTime()+days*86400000)}
function dayDelta(start,end){return Math.round((end-start)/86400000)}
function plMonth(d){return d.toLocaleDateString('id-ID',{timeZone:'UTC',month:'long',year:'numeric'})}
function plDay(d){return d.toLocaleDateString('id-ID',{timeZone:'UTC',day:'numeric',month:'short',year:'numeric'})}
function plDayShort(d){return d.toLocaleDateString('id-ID',{timeZone:'UTC',weekday:'short',day:'numeric'})}
function planningRepaint(){S.viewCache.delete(routeKey());renderRoute({keepContent:true});}
async function planningBundle(){
 const start=performance.now();const data=normalizePlanningBundleDates(await cached('planning:bundle',()=>ITAPI.call('planningBundle',{}),45000));
 S.planningData=data;S.projects=data.projects||[];
 console.info(`[ITCOMMAND PLANNING] Shared timeline+calendar bundle ready • ${Math.round(performance.now()-start)}ms`);
 return data;
}
function plProjectChooser(){return `<label class="pl-filter-label" for="planProject">◈ Project</label><select id="planProject" class="pl-project-select"><option value="">Semua proyek</option>${S.projects.map(p=>`<option value="${esc(p.id)}" ${S.planProject===p.id?'selected':''}>${esc(short(p.name,42))}</option>`).join('')}</select>`;}
function plMatches(row){return !S.planProject||row.projectId===S.planProject;}
function plCode(c){return String(c||'Other').toLowerCase().replace(/[^a-z]/g,'');}
function plCategoryLabel(category){return String(category||'Other');}
function plEmpty(message,sub){return `<div class="pl-empty"><div class="pl-empty-icon">✦</div><b>${esc(message)}</b><p>${esc(sub)}</p></div>`;}
function plKpi(icon,label,value,meta){return `<div class="pl-kpi"><span class="pl-kpi-icon">${icon}</span><span class="pl-kpi-meta">${esc(label)}</span><strong>${esc(value)}</strong><small>${esc(meta)}</small></div>`;}
function planCalendarItems(d){
 const out=[];
 const add=(obj)=>{if(parseISO(obj.startDate))out.push(obj)};
 (d.events||[]).forEach(r=>add({...r,category:r.category||'Other',source:'manual'}));
 (d.milestones||[]).forEach(r=>add({id:'mile-'+r.id,projectId:r.projectId,title:r.title||'Milestone',category:'Milestone',startDate:r.dueDate,source:'milestone',status:r.status,description:r.notes||''}));
 (d.releases||[]).forEach(r=>add({id:'release-'+r.id,projectId:r.projectId,title:(r.title||r.version||'Release'),category:'Release',startDate:r.date,source:'release',status:r.status,description:r.notes||''}));
 (d.deployments||[]).forEach(r=>add({id:'deploy-'+r.id,projectId:r.projectId,title:'Deploy · '+(r.platform||r.version||'Application'),category:'Deployment',startDate:r.date,source:'deployment',status:r.status,description:r.notes||''}));
 (d.projects||[]).forEach(r=>{
   if(r.startDate)add({id:'project-start-'+r.id,projectId:r.id,title:'Start · '+r.name,category:'Project',startDate:r.startDate,source:'project'});
   if(r.targetDate)add({id:'project-target-'+r.id,projectId:r.id,title:'Target release · '+r.name,category:'Deadline',startDate:r.targetDate,source:'project'});
 });
 return out.filter(plMatches).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||'')||(a.time||'').localeCompare(b.time||''));
}
function planIsOnDay(item,iso){return item.startDate<=iso&&iso<=(item.endDate||item.startDate);}
function planItemAction(item){
 if(item.source==='manual')return `data-action="planEdit" data-id="${esc(item.id)}"`;
 let target=item.source==='release'?'releases':item.source==='deployment'?'deployments':item.source==='milestone'?'workspace':'projects';
 return `data-action="planNavSource" data-target="${target}" data-project="${esc(item.projectId)}"`;
}
function planEventInline(item,compact=false){return `<button type="button" class="pl-event pl-cat-${plCode(item.category)} ${compact?'pl-compact':''}" ${planItemAction(item)} title="${esc(item.title)}"><span class="pl-event-pin"></span><span>${esc(short(item.title,compact?19:39))}</span></button>`;}
function planningHero(title,desc,actions){return head(title,desc,actions);}

// REVISI: INTERACTIVE DEVELOPMENT TIMELINE (EXECUTIVE SUNSET GANTT)
// ══════════════════════════════════════════════════════════════════════════
async function planningTimeline() {
  const d = await planningBundle();
  S.currentTable = 'ProjectTimelinePhases';
  S.currentList = null;

  const phases = (d.phases || []).filter(plMatches).slice().sort((a, b) => String(a.startDate).localeCompare(String(b.startDate)));
  const today = localISO(new Date());
  const delayed = phases.filter(x => x.endDate && x.endDate < today && x.status !== 'Completed' && Number(x.progress || 0) < 100);
  const active = phases.filter(x => x.status === 'In Progress');
  const milestones = (d.milestones || []).filter(plMatches).filter(x => parseISO(x.dueDate));
  const overall = phases.length ? Math.round(phases.reduce((sum, p) => sum + Number(p.progress || 0), 0) / phases.length) : 0;

  // Sizing & Dates Engine
  const rows = phases.filter(x => parseISO(x.startDate));
  const undatedPhases = phases.filter(x => !parseISO(x.startDate));
  if(undatedPhases.length)console.warn(`[ITCOMMAND TIMELINE] ${undatedPhases.length} phase tidak ditampilkan di Gantt karena startDate kosong/tidak valid. Data tetap tersedia untuk diedit.`,undatedPhases.map(x=>({id:x.id,startDate:x.startDate})));
  const dates = rows.flatMap(x => [parseISO(x.startDate), parseISO(x.endDate || x.startDate)]).concat(milestones.map(m => parseISO(m.dueDate))).filter(Boolean);
  const base = dates.length ? new Date(Math.min(...dates.map(x => x.getTime()))) : parseISO(today);
  const last = dates.length ? new Date(Math.max(...dates.map(x => x.getTime()))) : addPlanDays(base, 155);
  const floor = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth(), 1));
  const totalMonths = Math.max(6, Math.min(36, (last.getUTCFullYear() - floor.getUTCFullYear()) * 12 + (last.getUTCMonth() - floor.getUTCMonth()) + 2));
  const width = totalMonths * 133;
  const end = new Date(Date.UTC(floor.getUTCFullYear(), floor.getUTCMonth() + totalMonths, 1));
  const offsetDate = iso => Math.max(0, Math.min(width, dayDelta(floor, parseISO(iso) || floor) / Math.max(1, dayDelta(floor, end)) * width));
  const months = Array.from({length: totalMonths}, (_, i) => new Date(Date.UTC(floor.getUTCFullYear(), floor.getUTCMonth() + i, 1)));
  const currentX = parseISO(today) && today >= localISO(floor) && today <= localISO(end) ? offsetDate(today) : -1;
  const ticks = months.map((date, i) => `<div class="pl-axis-month" style="left:${i * 133}px;width:133px">${esc(date.toLocaleDateString('id-ID', {month: 'short', year: 'numeric', timeZone: 'UTC'}))}</div>`).join('');

  // Gantt Lanes Generator
  const lanes = rows.map((r, i) => {
    const begin = offsetDate(r.startDate), finish = offsetDate(r.endDate || r.startDate);
    const barWidth = Math.max(16, finish - begin);
    const progress = Math.max(0, Math.min(100, Number(r.progress || 0)));
    const late = r.endDate && r.endDate < today && !['Completed', 'Cancelled'].includes(r.status) && progress < 100;
    const pins = milestones.filter(m => m.projectId === r.projectId && m.dueDate >= r.startDate && m.dueDate <= (r.endDate || r.startDate))
      .map(m => `<span class="pl-milestone-pin" style="left:${offsetDate(m.dueDate)}px" title="${esc(m.title)} · ${esc(m.dueDate)}">◆</span>`).join('');
    const projectName = d.projects.find(x => x.id === r.projectId)?.name || 'Project';
    
    return `
      <div class="pl-gantt-row">
        <div class="pl-gantt-label">

// DATE INPUT FIX: normalize Sheets Date/ISO datetime before assigning a native HTML date input.
// All date-only values shown in Indonesian workspaces must remain local calendar dates.
function itInputDate(value){
 if(value==null||value==='')return '';
 const text=String(value).trim();
 const valid=ymd=>{const d=new Date(ymd+'T00:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===ymd?ymd:'';};
 if(/^\d{4}-\d{2}-\d{2}$/.test(text))return valid(text);
 const regional=text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
 if(regional)return valid(`${regional[3]}-${regional[2].padStart(2,'0')}-${regional[1].padStart(2,'0')}`);
 // Native date cells in Google Sheets are serialized to UTC ISO timestamps by Apps Script.
 // For a midnight date in an Asia/Jakarta spreadsheet this is often 17:00Z the day before.
 if(/^\d{4}-\d{2}-\d{2}[Tt\s]/.test(text)){
  const date=new Date(text);
  if(Number.isFinite(date.getTime())){
   const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(date);
   const part=key=>parts.find(x=>x.type===key)?.value||'';
   return valid(`${part('year')}-${part('month')}-${part('day')}`);
  }
 }
 if(/^\d{5}(?:\.\d+)?$/.test(text)){
  const serial=Number(text);
  if(serial>=20000&&serial<100000)return valid(new Date(Date.UTC(1899,11,30)+Math.floor(serial)*86400000).toISOString().slice(0,10));
 }
 return '';
}

 const unreadable=f.type==='date'&&str(value).trim()&&!v;
 if(unreadable)console.warn('[ITCOMMAND DATE] Tanggal sumber tidak dapat dibaca, simpan diblokir sampai diperbaiki.',{field:f.key,source:str(value)});
 if(f.type==='textarea')input=`<textarea id="${id}" name="${esc(f.key)}" rows="${f.key==='content'||f.key==='code'?12:4}" ${required}>${esc(v)}</textarea>`;

 else input=`<input type="${f.type}" id="${id}" name="${esc(f.key)}" value="${esc(v)}" ${required} ${f.min!=null?'min="'+f.min+'"':''} ${f.max!=null?'max="'+f.max+'"':''} placeholder="${esc(f.label)}">`;
 return `<div class="form-field ${full}"><label for="${id}">${esc(f.label)}${f.required?' *':''}</label>${input}${unreadable?'<small class="form-hint" style="color:#bd4b34!important">Format tanggal lama tidak dikenali. Jangan simpan sebelum diperbaiki.</small>':''}${f.key==='secretRef'?'<small class="form-hint">Referensi nama saja, jangan isi nilai token/key.</small>':''}</div>`;
}

// Patch the visible route and its matching memory cache AFTER the server confirms a write.
// Other module caches are invalidated narrowly, avoiding a cold reload of every tab.
function fastListArgs(table){
 if(S.route==='projects'&&table==='Projects')return {page:S.page,pageSize:APP_CONFIG.DEFAULT_PAGE_SIZE,query:S.query,archived:S.archivedFilter||'no'};
 if(definitions[S.route]?.table===table)return {page:S.page,pageSize:APP_CONFIG.DEFAULT_PAGE_SIZE,query:S.query,projectId:S.filterProject};
 if(S.route==='workspace'&&S.detailTab&&definitions[S.detailTab]?.table===table)return {page:1,pageSize:50,projectId:S.selectedId};

function matchVisibleRecord(row,table){
 if(table==='Projects'){
  const archived=!!row.archivedAt,filter=S.archivedFilter||'no';
  if(filter==='no'&&archived)return false;
  if(filter==='yes'&&!archived)return false;
 }else if(S.filterProject&&row.projectId!==S.filterProject)return false;
 const q=String(S.query||'').toLowerCase();
 return !q||Object.values(row).some(v=>typeof v==='string'&&v.toLowerCase().includes(q));
}
function applyConfirmedMutation(table,action,result,payload){
 S.dataVersion=(S.dataVersion||0)+1; // invalidate older in-flight module snapshots
 const id=result?.id||payload?.id;
 const deleting=action==='delete'||!!result?.deleted;
 const archivedAction=action==='archive'||action==='restore';
 // Merge into old state to preserve existing status/category if a backend response is partial.
 const previousRow=(table==='Projects'?S.projects:S.currentList?.items||[]).find?.(r=>r.id===id)||{};
 const body=(result&&typeof result==='object'&&!Array.isArray(result))?result:{};
 const row=deleting?null:{...previousRow,...payload,...body,id};
 const update=(items,filter=false)=>{
  const original=Array.isArray(items)?items:[];
  const oldIndex=original.findIndex(r=>r.id===id);
  const next=original.filter(r=>r.id!==id);
  // Only add a new item when it belongs to the active view.
  if(row&&(!filter||matchVisibleRecord(row,table))){
   if(oldIndex>=0)next.splice(Math.min(oldIndex,next.length),0,row);
   else next.unshift(row);
  }
  return next;
 };
 // Clear only data that really became stale: dashboards, activity, other filter/page views.
 if(['Projects','ProjectTimelinePhases','ProjectCalendarEvents','ProjectMilestones','ProjectReleases','ProjectDeployments'].includes(table)){
   const planHit=S.cache.get('planning:bundle');
   if(planHit?.value&&['ProjectTimelinePhases','ProjectCalendarEvents'].includes(table)){
    const prop=table==='ProjectTimelinePhases'?'phases':'events';
    const list=planHit.value[prop]||[];
    planHit.value[prop]=list.filter(x=>x.id!==id);
    if(row)planHit.value[prop].unshift(row);
    planHit.t=Date.now();S.planningData=planHit.value;
   }else{S.cache.delete('planning:bundle');}
  }
  for(const key of [...S.cache.keys()]){
  if(key==='dashboard'||key==='analytics'||key.startsWith('list:'+table+'{')||key.startsWith('activity'))S.cache.delete(key);
 }
 if(table==='Projects'){
  S.projects=update(S.projects);
  S.cache.set('projects:all',{value:{items:S.projects,total:S.projects.length,page:1,pageSize:100},t:Date.now()});
 }
 const args=fastListArgs(table);
 if(S.currentTable===table&&args&&S.currentList?.items){
  const prev=S.currentList;
  const existed=prev.items.some(r=>r.id===id);
  const nextItems=update(prev.items,true);
  const nowExists=nextItems.some(r=>r.id===id);
  const delta=(nowExists?1:0)-(existed?1:0);
  const next={...prev,items:nextItems.slice(0,Math.max(1,Number(args.pageSize)||25)),total:Math.max(0,(Number(prev.total)||0)+delta)};
  S.currentList=next;S.rows=next.items;
  S.cache.set('list:'+table+JSON.stringify(args),{value:next,t:Date.now()});
 }
 S.viewCache.clear();
 return !!(args&&S.currentTable===table&&S.cache.has('list:'+table+JSON.stringify(args)));
}
async function finishMutationUI(table,action,result,payload,originRoute){
 const inCurrent=applyConfirmedMutation(table,action,result,payload);
 // If the user switched tabs while saving, never force them back to the previous page.
 if(S.route!==originRoute)return;
 // Immediate, synchronous number update. Does NOT wait for any network request.
 if(inCurrent)IT_instantHeroMetrics();
 // Rebuild only the record list + telemetry from warm cache without skeleton/reload.
 await renderRoute({keepContent:true});
 // Guard against an old DOM fragment or stale response replacing the latest counts.
 IT_instantHeroMetrics();
}

async function exportCSV() {

async function importJSON() {
  const file = $('importFile')?.files?.[0];
  if (!file) {
    toast('Pilih berkas JSON terlebih dahulu.', 'error');
    return;
  }
  if (file.size > 850000) {
    toast('Ukuran berkas melebihi batas (~850 KB).', 'error');
    return;
  }

  const btn = document.querySelector('[data-action="importJSON"]');
  const origHtml = btn ? btn.innerHTML : '';

  try {
    const data = JSON.parse(await file.text());
    if (data.format !== 'IT_COMMAND_CENTER_BACKUP_V1' || !data.tables) {
      throw new Error('Format skema backup tidak valid.');
    }

    const count = Object.values(data.tables).reduce((acc, items) => acc + (Array.isArray(items) ? items.length : 0), 0);
    if (!await askConfirm('Mulai Impor Data?', `Sistem akan mengimpor ${count} record sebagai salinan data baru tanpa menimpa data lama.`, 'Mulai Impor')) {
      return;
    }

    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `
        <span class="inline-block w-4 h-4 border-2 border-orange-500 border-t-transparent rounded-full animate-spin mr-2 align-middle"></span>
        <span class="text-orange-600 font-bold">Memvalidasi & Menyimpan Data...</span>
      `;
    }

    toast('Sedang menulis data ke Google Sheets...');
    const result = await ITAPI.call('importBundle', { bundle: data });
    
    invalidate();
    toast(`✓ Berhasil mengimpor ${result.imported} record!`);
    nav('projects');
  } catch (e) {
    error(e);
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = origHtml;
    }
  }
}

  else if(action==='edit')openForm(table,id);
  else if(action==='preview')openPreview(table,id);
  else if(action==='openProject'){S.selectedId=id;S.detailTab='overview';nav('workspace',{selectedId:id,tab:'overview'});}
  else if(action==='detailTab'){S.detailTab=b.dataset.tab;renderRoute();}
  else if(action==='refresh'){invalidate();renderRoute();toast('Refreshing data…');}
  else if(action==='toggleView'){S.view=S.view==='grid'?'table':'grid';renderRoute();}
  else if(action==='pagePrev'){S.page=Math.max(1,S.page-1);renderRoute();}
  else if(action==='pageNext'){S.page+=1;renderRoute();}
  else if(action==='sort'){S.sortDir=S.sort===b.dataset.key?-S.sortDir:1;S.sort=b.dataset.key;renderRoute();}
  else if(action==='submitRecord')await saveForm();
  else if(action==='generateChangelog')await generateChangelog();
  else if(action==='closeDrawer')closeDrawer();
  else if(action==='copyPreview'){await navigator.clipboard.writeText(S.previewText||'');toast('Copied');}
  else if(action==='duplicate'){await mutate('duplicate','',{id});toast('Project duplicated');}
  else if(action==='archive'){
   const row=S.projects.find(x=>x.id===id);if(!row)throw new Error('Project not found');await mutate(row.archivedAt?'restore':'archive','',{id});toast(row.archivedAt?'Project restored':'Project archived');
  }
  else if(action==='favorite'){const row=S.projects.find(x=>x.id===id);if(!row)throw new Error('Project not found');await mutate('save','Projects',{id,favorite:row.favorite==='true'?'false':'true'});toast('Favorite updated');}
  else if(action==='delete')await confirmDelete(table,id);
  else if(action==='confirmDelete'){const p=S.pendingDelete;const yes=b;yes.disabled=true;try{await mutate('delete',p.table,{id:p.id});closeDrawer();toast('Data deleted');}catch(err){yes.disabled=false;throw err;}}
  else if(action==='exportCSV')await exportCSV();
  else if(action==='exportJSON')await exportJSON();
  else if(action==='importJSON')await importJSON();
  else if(action==='logout'){await IT_fastLogout();}
 }catch(err){error(err);}
});
document.addEventListener('submit',async e=>{
 const form=e.target;
 if(form.id==='recordForm'){
  e.preventDefault(); // Enter must never reload the dashboard.
  await saveForm();return;
 }
 if(!['profileForm','settingsForm','changeEmailForm','changePasswordForm'].includes(form.id))return;
 e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;
 try{
  const values=Object.fromEntries(new FormData(form).entries());
  if(form.id==='profileForm'){const user=await ITAPI.call('updateProfile',values);userInit(user);invalidate();toast('Profile saved');}
  if(form.id==='settingsForm'){S.settings=await ITAPI.call('saveSettings',values);S.view=S.settings.defaultView;invalidate();toast('Preferences saved');}
  if(form.id==='changeEmailForm'){if(!await askConfirm('Ubah email akun?','Email baru wajib diverifikasi, kemudian kamu harus login kembali.', 'Ubah email'))return;await ITAuth.changeEmail(values.newEmail,values.password);toast('Verifikasi dikirim ke alamat email baru.');location.replace('index.html');}
  if(form.id==='changePasswordForm'){await ITAuth.changePassword(values.newPassword);form.reset();toast('Password changed');}
 }catch(err){error(err);}finally{button.disabled=false;}
});
(async()=>{
 try{
  if(!ITAuth.hasSession()){location.replace('index.html');return;}
  let initial;
  try{initial=await ITAPI.call('workspaceInit');}catch(e){if(e.code!=='UNKNOWN_ACTION')throw e;
    const [user,settings]=await Promise.all([ITAPI.call('me'),ITAPI.call('getSettings')]);initial={user,settings};}
  userInit(initial.user);S.settings=initial.settings||{};S.view=S.settings.defaultView||'grid';console.info(`[ITCOMMAND PERF] Workspace auth+settings ready • ${Math.round(performance.now()-IT_TIMING.bootStart)}ms`);
  const hash=location.hash.slice(1),route=titles[hash]?hash:'overview';S.route=route;drawNav();await renderRoute();console.info(`[ITCOMMAND PERF] Initial workspace interactive • ${Math.round(performance.now()-IT_TIMING.bootStart)}ms`);
 }catch(e){console.error('Workspace init',e);ITAuth.clear();location.replace('index.html');}
})();
})();
