function toast(message,type='success'){
 const wrap=$('toasts'),el=document.createElement('div');el.className='toast'+(type==='error'?' error':'');el.setAttribute('role',type==='error'?'alert':'status');
 const badge=document.createElement('div');badge.className='toast-badge';badge.textContent=type==='error'?'!':'✓';
 const content=document.createElement('div'),title=document.createElement('strong'),desc=document.createElement('p');title.textContent=type==='error'?'Ada masalah':'Berhasil';desc.textContent=String(message||'');content.append(title,desc);
 const close=document.createElement('button');close.type='button';close.setAttribute('aria-label','Close notification');close.textContent='×';
 el.append(badge,content,close);wrap.append(el);
 const dismiss=()=>{el.classList.add('toast-leave');setTimeout(()=>el.remove(),200);};const timer=setTimeout(dismiss,5200);
 close.onclick=()=>{clearTimeout(timer);dismiss();};
}

async function cached(key,loader,ttl=35000){const hit=S.cache.get(key);if(hit?.promise)return hit.promise;if(hit&&Date.now()-hit.t<ttl){IT_TIMING.cacheHits++;return hit.value;}const promise=Promise.resolve().then(loader),entry={promise};S.cache.set(key,entry);try{const value=await promise;if(S.cache.get(key)===entry)S.cache.set(key,{value,t:Date.now()});return value;}catch(e){if(S.cache.get(key)===entry)S.cache.delete(key);throw e;}}

async function moduleData(table,args){
 const projectHit=S.cache.get('projects:all');
 if(projectHit&&projectHit.value&&Date.now()-projectHit.t<35000){await loadProjects();return list(table,args);}
 try{const d=await ITAPI.call('moduleSnapshot',{table,...args});
  S.projects=d.projects.items;S.cache.set('projects:all',{value:d.projects,t:Date.now()});
  S.cache.set('list:'+table+JSON.stringify(args),{value:d.records,t:Date.now()});return d.records;
 }catch(e){if(e.code!=='UNKNOWN_ACTION')throw e;
  await loadProjects();return list(table,args);}
}

async function renderRoute(){
 const navStarted=performance.now();const routeName=S.route;
 const seq=++S.requestId,key=routeKey();
 const prev=S.viewCache.get(key);
 // Instant route restoration for a recently visited tab without another backend call.
 if(prev && Date.now()-prev.at<15000){
   S.currentTable=prev.table;S.currentList=prev.list;S.rows=prev.rows;setContent(prev.html);postRender();const ms=Math.round(performance.now()-navStarted);IT_TIMING.navigation.push({route:routeName,ms,source:'memory'});console.info(`[ITCOMMAND NAV] ${routeName} • ${ms}ms • MEMORY CACHE`);return;
 }
 // Clear the previous module synchronously. Never display module A beneath active tab B.
 S.currentTable='';S.currentList=null;S.rows=[];setContent(skeleton(S.route));
 try{let h;
  switch(S.route){case 'overview':h=await overview();break;case 'projects':h=await projects();break;case 'workspace':h=await workspace();break;
   case 'activity':h=await activity();break;case 'analytics':h=await analytics();break;case 'backup':h=backup();break;case 'settings':h=await settings();break;
   default:h=await generic(S.route);}
  if(seq!==S.requestId)return;
  setContent(h);S.viewCache.set(key,{at:Date.now(),html:h,table:S.currentTable,list:S.currentList,rows:S.rows});
  if(S.viewCache.size>28)S.viewCache.delete(S.viewCache.keys().next().value);
  postRender();const ms=Math.round(performance.now()-navStarted);IT_TIMING.navigation.push({route:routeName,ms,source:'api'});if(IT_TIMING.navigation.length>60)IT_TIMING.navigation.shift();console.info(`[ITCOMMAND NAV] ${routeName} • ${ms}ms • API RENDER`);
 }catch(e){if(seq!==S.requestId)return;
  setContent(head('Gagal memuat modul','Data belum berhasil diambil dari Google Apps Script. Data lain tetap aman.')+`<div class="panel panel-pad"><h3 style="font-size:15px;margin-bottom:10px">Koneksi perlu diperiksa</h3><p class="sub">${esc(e.message)}</p><div style="margin-top:18px">${btn('↻ Coba lagi','refresh')}</div></div>`);error(e);
 }
}

async function exportJSON(){try{const data=await ITAPI.call('exportBundle');download(JSON.stringify(data,null,2),'it-development-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Backup downloaded');}catch(e){error(e);}}
async function importJSON(){const file=$('importFile')?.files?.[0];if(!file){toast('Pilih file JSON terlebih dahulu.','error');return;}
 if(file.size>850000){toast('File terlalu besar untuk request API ini (maksimum ~850 KB).','error');return;}
 try{const data=JSON.parse(await file.text());if(data.format!=='IT_COMMAND_CENTER_BACKUP_V1'||!data.tables)throw new Error('Format backup tidak sesuai.');
  const count=Object.values(data.tables).reduce((acc,items)=>acc+(Array.isArray(items)?items.length:0),0);
  if(!await askConfirm('Impor backup?',`Impor ${count} record sebagai salinan baru. Data lama tidak ditimpa.`, 'Mulai impor'))return;
  const result=await ITAPI.call('importBundle',{bundle:data});invalidate();toast(`Import berhasil: ${result.imported} record(s)`);nav('projects');
 }catch(e){error(e);}}
let chartPending=null;
function ensureChart(){if(window.Chart)return Promise.resolve();if(chartPending)return chartPending;
 chartPending=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js';script.onload=resolve;script.onerror=()=>{chartPending=null;reject(new Error('Chart.js cannot load'));};document.head.append(script);});return chartPending;}
function chart(container,rows,type='doughnut'){
 if(!document.getElementById(container))return;const node=$(container);if(!rows?.length){node.innerHTML='<div class="empty" style="padding:45px 8px"><b>No chart data yet</b><p>Add records to see live analytics.</p></div>';return;}
 node.innerHTML='<canvas></canvas>';const labels=rows.slice(0,15).map(r=>r.name||'Other'),values=rows.slice(0,15).map(r=>r.value||0);
 const colors=['#f97316','#ffba73','#fd8b44','#f6d0b0','#d48552','#fbaf97','#a5b8c3','#ffcaa7','#cb744b','#ffc257','#f18b67','#d7aba0'];
 const config={type,data:{labels,datasets:[{label:'Records',data:values,backgroundColor:colors,borderWidth:type==='doughnut'?3:0,borderColor:'#fff',borderRadius:type==='bar'?5:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:type==='doughnut',position:'bottom',labels:{usePointStyle:true,boxWidth:9,font:{size:10,family:'Plus Jakarta Sans'}}},tooltip:{enabled:true}},
  scales:type==='doughnut'?{}:{y:{beginAtZero:true,ticks:{precision:0,font:{size:10}},grid:{color:'#f5eee8'}},x:{ticks:{font:{size:10}},grid:{display:false}}}}};
 try{S.charts.push(new Chart(node.querySelector('canvas'),config));}catch(e){node.innerHTML='<p class="sub">Chart could not be rendered.</p>';console.warn(e);}}
async function renderDashboardCharts(){try{await ensureChart();if(S.route!=='overview')return;chart('statusChart',S.dashboard?.status||[],'doughnut');chart('technologyChart',S.dashboard?.technologies||[],'bar');}catch(e){console.warn(e);['statusChart','technologyChart'].forEach(id=>{if($(id))$(id).textContent='Chart tidak dapat dimuat saat ini.';});}}
async function renderAnalyticsCharts(){try{await ensureChart();if(S.route!=='analytics')return;
 const groups=['types','statuses','technologies','bugSeverity','features','deployments','projectGrowth','releases'];groups.forEach((key,i)=>chart('analytics-'+key,S.analytics?.[key]||[],i<2?'doughnut':'bar'));}catch(e){console.warn(e);document.querySelectorAll('[id^=analytics-]').forEach(el=>el.textContent='Chart tidak dapat dimuat saat ini.');}}
let searchTimer;
$('menuButton').addEventListener('click',openMobile);$('mobileBackdrop').addEventListener('click',closeMobile);$('overlay').addEventListener('click',closeDrawer);$('closeDrawer').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeDrawer();closeMobile();}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('globalSearch').focus();}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'&&S.route!=='settings'){e.preventDefault();openForm(S.route==='projects'?'Projects':definitions[S.route]?.table||'Projects');}
});
$('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();nav('projects',{query:e.currentTarget.value.trim()});}});
document.addEventListener('input',e=>{if(e.target.id==='moduleSearch'){clearTimeout(searchTimer);const text=e.target.value;searchTimer=setTimeout(()=>{S.query=text.trim();S.page=1;renderRoute();},380);}});
document.addEventListener('change',e=>{
 if(e.target.id==='filterProject'){S.filterProject=e.target.value;S.page=1;renderRoute();}
 if(e.target.id==='archiveFilter'){S.archivedFilter=e.target.value;S.page=1;renderRoute();}
 if(e.target.id==='workspaceProject'){S.selectedId=e.target.value;S.detailTab='overview';renderRoute();}
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b)return;if(b.tagName==='A'&&b.getAttribute('href'))return;
 const action=b.dataset.action,id=b.dataset.id,table=b.dataset.table;
 try{
  if(action==='nav')nav(b.dataset.target);
  else if(action==='newProject')openForm('Projects');
  else if(action==='create')openForm(table|| (S.route==='projects'?'Projects':definitions[S.route]?.table||'Projects'));
  else if(action==='edit')openForm(table,id);
  else if(action==='preview')openPreview(table,id);
  else if(action==='openProject'){S.selectedId=id;S.detailTab='overview';nav('workspace',{selectedId:id,tab:'overview'});}
  else if(action==='detailTab'){S.detailTab=b.dataset.tab;renderRoute();}
  else if(action==='refresh'){invalidate();renderRoute();toast('Refreshing data…');}
  else if(action==='toggleView'){S.view=S.view==='grid'?'table':'grid';renderRoute();}
  else if(action==='pagePrev'){S.page=Math.max(1,S.page-1);renderRoute();}
  else if(action==='pageNext'){S.page+=1;renderRoute();}
  else if(action==='sort'){S.sortDir=S.sort===b.dataset.key?-S.sortDir:1;S.sort=b.dataset.key;renderRoute();}
  else if(action==='submitRecord')await saveForm();
  else if(action==='generateChangelog')await generateChangelog();
  else if(action==='closeDrawer')closeDrawer();
  else if(action==='copyPreview'){await navigator.clipboard.writeText(S.previewText||'');toast('Copied');}
  else if(action==='duplicate'){await mutate('duplicate','',{id});toast('Project duplicated');}
  else if(action==='archive'){
   const row=S.projects.find(x=>x.id===id);if(!row)throw new Error('Project not found');await mutate(row.archivedAt?'restore':'archive','',{id});toast(row.archivedAt?'Project restored':'Project archived');
  }
  else if(action==='favorite'){const row=S.projects.find(x=>x.id===id);if(!row)throw new Error('Project not found');await mutate('save','Projects',{id,favorite:row.favorite==='true'?'false':'true'});toast('Favorite updated');}
  else if(action==='delete')await confirmDelete(table,id);
  else if(action==='confirmDelete'){const p=S.pendingDelete;const yes=b;yes.disabled=true;try{await mutate('delete',p.table,{id:p.id});closeDrawer();toast('Data deleted');}catch(err){yes.disabled=false;throw err;}}
  else if(action==='exportCSV')await exportCSV();
  else if(action==='exportJSON')await exportJSON();
  else if(action==='importJSON')await importJSON();
  else if(action==='logout'){if(await askConfirm('Keluar dari workspace?','Sesi di perangkat ini akan diakhiri. Data yang tersimpan tetap aman.','Keluar',true)){await ITAuth.logout();location.replace('index.html');}}
 }catch(err){error(err);}
});
document.addEventListener('submit',async e=>{
 const form=e.target;
 if(!['profileForm','settingsForm','changeEmailForm','changePasswordForm'].includes(form.id))return;
 e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;
 try{
  const values=Object.fromEntries(new FormData(form).entries());
  if(form.id==='profileForm'){const user=await ITAPI.call('updateProfile',values);userInit(user);invalidate();toast('Profile saved');}
  if(form.id==='settingsForm'){S.settings=await ITAPI.call('saveSettings',values);S.view=S.settings.defaultView;invalidate();toast('Preferences saved');}
  if(form.id==='changeEmailForm'){if(!await askConfirm('Ubah email akun?','Email baru wajib diverifikasi, kemudian kamu harus login kembali.', 'Ubah email'))return;await ITAuth.changeEmail(values.newEmail,values.password);toast('Verifikasi dikirim ke alamat email baru.');location.replace('index.html');}
  if(form.id==='changePasswordForm'){await ITAuth.changePassword(values.newPassword);form.reset();toast('Password changed');}
 }catch(err){error(err);}finally{button.disabled=false;}
});
(async()=>{
 try{
  if(!ITAuth.hasSession()){location.replace('index.html');return;}
  let initial;
  try{initial=await ITAPI.call('workspaceInit');}catch(e){if(e.code!=='UNKNOWN_ACTION')throw e;
    const [user,settings]=await Promise.all([ITAPI.call('me'),ITAPI.call('getSettings')]);initial={user,settings};}
  userInit(initial.user);S.settings=initial.settings||{};S.view=S.settings.defaultView||'grid';console.info(`[ITCOMMAND PERF] Workspace auth+settings ready • ${Math.round(performance.now()-IT_TIMING.bootStart)}ms`);
  const hash=location.hash.slice(1),route=titles[hash]?hash:'overview';S.route=route;drawNav();await renderRoute();console.info(`[ITCOMMAND PERF] Initial workspace interactive • ${Math.round(performance.now()-IT_TIMING.bootStart)}ms`);
 }catch(e){console.error('Workspace init',e);ITAuth.clear();location.replace('index.html');}
})();
})();
</script></body></html>
