 default:h=await generic(S.route);}

 return head('Build. Ship. Evolve.','Seluruh pengembangan dan operasional produk IT dalam satu tampilan.',btn('+ New Project','newProject')+btn('View All Projects','nav','data-target="projects"'))+
 `<section class="grid-stats">${stats.map(([label,n,icon])=>`<div class="panel stat"><div class="iconbox">${icon}</div><strong>${Number(n)||0}</strong><p>${esc(label)}</p></div>`).join('')}</section>

 <section class="panel panel-pad"><div class="panel-head"><b>Development activity</b>${btn('See activity','nav','data-target="activity"')}</div>${(d.activities||[]).length?timeline(d.activities.slice(0,6)):empty('No recent activity','Aktivitas akan muncul setelah data dibuat atau diperbarui.')}</section></div>

function renderTable(rows,columns,table){let out=`<div class="panel table-scroll"><table class="data-table"><thead><tr>${(table==='Projects'?[]:['projectId']).concat(columns).map(k=>`<th data-action="sort" data-key="${esc(k)}">${esc(headerName(k))} ↕</th>`).join('')}<th>Actions</th></tr></thead><tbody>`;
 if(S.sort)rows=rows.slice().sort((a,b)=>str(a[S.sort]).localeCompare(str(b[S.sort]),'id',{numeric:true})*S.sortDir);
 out+=rows.map(row=>`<tr>${(table==='Projects'?[]:['projectId']).concat(columns).map((k,i)=>{let val=row[k];let display='';
 if(k==='projectId')display=esc(short(projectName(val),35));
 else if(['status','priority','severity','environment','isDone'].includes(k))display=badge(val);
 else if(k==='amount')display=esc(money(val,row.currency||'IDR'));
 else if(k==='expiresAt'&&val){const days=Math.ceil((new Date(val).getTime()-Date.now())/86400000);display=esc(fmtDate(val))+(Number.isFinite(days)&&days<=30?` <span class="tag ${days<0?'red':'grey'}">${days<0?'Expired':'Due soon'}</span>`:'');}
 else if(k==='url'||k==='docsUrl'||k==='productionUrl'||k==='baseUrl'){
   const u=urlSafe(val);display=u?`<a style="color:#e87026" target="_blank" rel="noopener noreferrer" href="${esc(u)}">Open link ↗</a>`:esc(short(val,35));
 }else display=esc(short(dateField(k,val),65));
 return `<td class="${i===0?'primarytext':''}">${display||'—'}</td>`;}).join('')}<td><div class="toolbar" style="flex-wrap:nowrap">
 <button class="btn small" data-action="edit" data-table="${table}" data-id="${esc(row.id)}">Edit</button>
 ${table==='Projects'?`<button class="btn small" data-action="openProject" data-id="${esc(row.id)}">Open</button>`:`<button class="btn small" data-action="preview" data-table="${table}" data-id="${esc(row.id)}">View</button>`}
 <button class="btn small danger" data-action="delete" data-table="${table}" data-id="${esc(row.id)}">Delete</button></div></td></tr>`).join('');return out+'</tbody></table></div>';}
function headerName(key){return key.replace(/([A-Z])/g,' $1').replace(/^\w/,c=>c.toUpperCase());}
function pager(d){const totalPages=Math.max(1,Math.ceil(d.total/d.pageSize));if(totalPages===1)return `<p class="sub" style="margin-top:13px">${d.total} record(s)</p>`;

  else if(action==='refresh'){invalidate();renderRoute();toast('Refreshing data…');}
  else if(action==='toggleView'){S.view=S.view==='grid'?'table':'grid';renderRoute();}
  else if(action==='pagePrev'){S.page=Math.max(1,S.page-1);renderRoute();}
  else if(action==='pageNext'){S.page+=1;renderRoute();}
  else if(action==='sort'){S.sortDir=S.sort===b.dataset.key?-S.sortDir:1;S.sort=b.dataset.key;renderRoute();}
  else if(action==='submitRecord')await saveForm();
  else if(action==='generateChangelog')await generateChangelog();
  else if(action==='closeDrawer')closeDrawer();
  else if(action==='copyPreview'){await navigator.clipboard.writeText(S.previewText||'');toast('Copied');}
  else if(action==='duplicate'){await mutate('duplicate','',{id});toast('Project duplicated');}
  else if(action==='archive'){
   const row=S.projects.find(x=>x.id===id);if(!row)throw new Error('Project not found');await mutate(row.archivedAt?'restore':'archive','',{id});toast(row.archivedAt?'Project restored':'Project archived');
  }
  else if(action==='favorite'){const row=S.projects.find(x=>x.id===id);if(!row)throw new Error('Project not found');await mutate('save','Projects',{id,favorite:row.favorite==='true'?'false':'true'});toast('Favorite updated');}
  else if(action==='delete')confirmDelete(table,id);
  else if(action==='confirmDelete'){const p=S.pendingDelete;const yes=b;yes.disabled=true;try{await mutate('delete',p.table,{id:p.id});closeDrawer();toast('Data deleted');}catch(err){yes.disabled=false;throw err;}}
  else if(action==='exportCSV')await exportCSV();
  else if(action==='exportJSON')await exportJSON();
  else if(action==='importJSON')await importJSON();
  else if(action==='logout'){if(confirm('Keluar dari akun ini?')){await ITAuth.logout();location.replace('index.html');}}
 }catch(err){error(err);}
});
document.addEventListener('submit',async e=>{
 const form=e.target;
 if(!['profileForm','settingsForm','changeEmailForm','changePasswordForm'].includes(form.id))return;
 e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;
 try{
  const values=Object.fromEntries(new FormData(form).entries());
  if(form.id==='profileForm'){const user=await ITAPI.call('updateProfile',values);userInit(user);invalidate();toast('Profile saved');}
  if(form.id==='settingsForm'){S.settings=await ITAPI.call('saveSettings',values);S.view=S.settings.defaultView;invalidate();toast('Preferences saved');}
  if(form.id==='changeEmailForm'){if(!confirm('Ubah email? Kamu harus memverifikasi email baru dan login kembali.'))return;await ITAuth.changeEmail(values.newEmail,values.password);alert('Verifikasi telah dikirim ke email baru. Login ulang setelah verifikasi.');location.replace('index.html');}
  if(form.id==='changePasswordForm'){await ITAuth.changePassword(values.newPassword);form.reset();toast('Password changed');}
 }catch(err){error(err);}finally{button.disabled=false;}
});
(async()=>{
 try{
  if(!ITAuth.hasSession()){location.replace('index.html');return;}
  const user=await ITAPI.call('me');userInit(user);
  S.settings=await ITAPI.call('getSettings');S.view=S.settings.defaultView||'grid';
  const hash=location.hash.slice(1),route=titles[hash]?hash:'overview';S.route=route;drawNav();await renderRoute();
 }catch(e){console.error('Workspace init',e);ITAuth.clear();location.replace('index.html');}
})();
})();
</script></body></html>
